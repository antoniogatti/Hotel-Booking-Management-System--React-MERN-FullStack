name: Build and deploy Node.js app to Azure Web App - palazzopinto-api-secure-pro

on:
  push:
    branches:
      - main
    paths:
      - hotel-booking-backend/**
      - .github/workflows/main_palazzopinto-api-secure-pro.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-pro-main
  cancel-in-progress: true

env:
  APP_NAME: palazzopinto-api-secure-pro
  APP_SLOT: Production

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-booking-backend/package-lock.json

      - name: Install dependencies
        working-directory: hotel-booking-backend
        run: npm ci

      - name: Build
        working-directory: hotel-booking-backend
        run: npm run build

      - name: Prune dev dependencies
        working-directory: hotel-booking-backend
        run: npm prune --omit=dev

      - name: Create deployment package
        run: |
          rm -rf backend-release
          mkdir -p backend-release
          cp -R hotel-booking-backend/dist backend-release/dist
          cp -R hotel-booking-backend/node_modules backend-release/node_modules
          cp hotel-booking-backend/package.json backend-release/package.json
          cp hotel-booking-backend/package-lock.json backend-release/package-lock.json
          cp hotel-booking-backend/web.config backend-release/web.config
          cd backend-release
          zip -r ../backend-release.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E9C26D06E0947FB97C8224090F2FAD1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2A835528BC44848B83504570D352A97 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CE36E45D96841FE9300FEED6DE9D7A2 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.APP_SLOT }}
          package: backend-release.zip
