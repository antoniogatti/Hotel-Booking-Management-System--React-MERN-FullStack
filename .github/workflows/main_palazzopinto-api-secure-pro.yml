name: Build and deploy FE then BE to Azure Web Apps - palazzopinto-web+api-pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-pro-main
  cancel-in-progress: true

env:
  APP_NAME: palazzopinto-api-secure-pro
  APP_SLOT: Production

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    env:
      APP_NAME: palazzopinto-web-2603151048-pro
      APP_SLOT: Production
      VITE_API_BASE_URL: https://palazzopinto-api-secure-pro.azurewebsites.net
      VITE_APP_ENV: production
      VITE_APP_VERSION: "1.11.3"
      VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAELRojYEByXtdZLr"
      VITE_ENABLE_DEV_CAPTCHA: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-booking-frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: hotel-booking-frontend
        run: npm ci

      - name: Build frontend
        working-directory: hotel-booking-frontend
        run: npm run build:prod

      - name: Create frontend deployment package
        run: |
          rm -f frontend-release.zip
          cp hotel-booking-frontend/server.js hotel-booking-frontend/dist/server.js
          cd hotel-booking-frontend/dist
          zip -r ../../frontend-release.zip .

      - name: Login to Azure (frontend)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C26ED99A521E441F843A8073E26D3D5A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C1712A05FD7746D5A7C314DDDA4B43F0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF1137C7F0F4E02BB2C7693C94DA917 }}

      - name: Deploy frontend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.APP_SLOT }}
          package: frontend-release.zip

  build-and-deploy-backend:
    needs: build-and-deploy-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-booking-backend/package-lock.json

      - name: Install backend dependencies
        working-directory: hotel-booking-backend
        run: npm ci

      - name: Build backend
        working-directory: hotel-booking-backend
        run: npm run build

      - name: Prune dev dependencies
        working-directory: hotel-booking-backend
        run: npm prune --omit=dev

      - name: Create backend deployment package
        run: |
          rm -rf backend-release
          mkdir -p backend-release
          cp -R hotel-booking-backend/dist backend-release/dist
          cp -R hotel-booking-backend/node_modules backend-release/node_modules
          cp hotel-booking-backend/package.json backend-release/package.json
          cp hotel-booking-backend/package-lock.json backend-release/package-lock.json
          cp hotel-booking-backend/web.config backend-release/web.config
          cd backend-release
          zip -r ../backend-release.zip .

      - name: Login to Azure (backend)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_2E9C26D06E0947FB97C8224090F2FAD1 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A2A835528BC44848B83504570D352A97 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_6CE36E45D96841FE9300FEED6DE9D7A2 }}

      - name: Deploy backend to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.APP_SLOT }}
          package: backend-release.zip
