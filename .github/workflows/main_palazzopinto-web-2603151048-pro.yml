name: Build and deploy Vite app to Azure Web App - palazzopinto-web-2603151048-pro

on:
  push:
    branches:
      - main
    paths:
      - hotel-booking-frontend/**
      - .github/workflows/main_palazzopinto-web-2603151048-pro.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-web-pro-main
  cancel-in-progress: true

env:
  APP_NAME: palazzopinto-web-2603151048-pro
  APP_SLOT: Production
  VITE_API_BASE_URL: https://api.palazzopintobnb.com
  VITE_APP_ENV: production
  VITE_APP_VERSION: "1.11.3"
  VITE_TURNSTILE_SITE_KEY: "0x4AAAAAAELRojYEByXtdZLr"
  VITE_ENABLE_DEV_CAPTCHA: "false"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hotel-booking-frontend/package-lock.json

      - name: Install dependencies
        working-directory: hotel-booking-frontend
        run: npm ci

      - name: Build
        working-directory: hotel-booking-frontend
        run: npm run build:prod

      - name: Create frontend deployment package
        run: |
          rm -f frontend-release.zip
          cd hotel-booking-frontend/dist
          zip -r ../../frontend-release.zip .

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_C26ED99A521E441F843A8073E26D3D5A }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C1712A05FD7746D5A7C314DDDA4B43F0 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1FF1137C7F0F4E02BB2C7693C94DA917 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.APP_NAME }}
          slot-name: ${{ env.APP_SLOT }}
          package: frontend-release.zip
